<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AITHER – Nueva incidencia</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 (solo grid) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="../css/incidenciasform.css">
</head>
<body>

<header class="main-header">
    <div class="container">
        <a href="/" class="logo">
            <img src="../img/logo_aitherTX.png" alt="Logo AITHER">
        </a>
        <nav class="main-nav">
            <ul>
                <li><a href="#">SABER MÁS</a></li>
                <li><a href="#">¿QUIÉNES SOMOS?</a></li>
                <li><a href="#">FAQ</a></li>
            </ul>
        </nav>
        <a href="login.html" class="btn-login">INICIAR SESIÓN</a>
    </div>
</header>

<main>
    <div class="form-wrapper">
        <h2>Formulario de incidencias</h2>
        <form id="incidenciaForm">
            <!-- Campo oculto: se rellena solo con el id del usuario logueado -->
            <input type="hidden" name="id_user" id="id_user">

            <div class="mb-3">
                <label class="form-label">Título *</label>
                <input type="text" name="titulo" class="form-control" maxlength="150" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Descripción *</label>
                <textarea name="descripcion" class="form-control" rows="4" required></textarea>
            </div>

            <!-- Botón para elegir imagen (por ahora solo selecciona) -->
            <div class="mb-3">
                <label class="form-label">Imagen (opcional)</label>
                <input type="file" name="imagen" class="form-control" accept="image/*">
            </div>

            <button type="submit" class="btn btn-primary">Enviar incidencia</button>
            <div id="msg"></div>
        </form>
    </div>
</main>

<script src="../js/incidenciaform.js"></script>
</body>
</html>
