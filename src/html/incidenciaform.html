<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AITHER – Nueva incidencia</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 (solo grid) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root{
            --Principal_1: #152D9A;
            --Principal_2: #587DBD;
            --Secundario_Blanco: #ffffff;
            --Gris_claro: #ddd;
            --Fondo: #0b1220;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            min-height:100vh;
            font-family:'Montserrat',sans-serif;
            background:var(--Fondo) url('../img/landing.jpg') no-repeat center/cover fixed;
            color:var(--Secundario_Blanco);
            position:relative;
            z-index:1;
        }
        body::before{
            content:'';
            position:absolute;
            inset:0;
            background:#587dbd81;
            z-index:-1;
        }
        a{text-decoration:none;color:inherit;}
        .main-header{
            padding:20px 0;
            font-weight:bold;
        }
        .main-header .container{
            display:flex;
            justify-content:space-between;
            align-items:center;
            max-width:1200px;
            margin:auto;
            padding:0 20px;
        }
        .logo img{height:40px;}
        .main-nav ul{
            display:flex;list-style:none;gap:25px;
        }
        .btn-login{
            margin-left:30px;
            background:var(--Principal_1);
            color:#fff;
            padding:8px 22px;
            border-radius:50px;
            transition:.3s;
        }
        .btn-login:hover{background:var(--Principal_2);color:#fff;}

        /* --------- formulario --------- */
        .form-wrapper{
            max-width:600px;
            margin:60px auto 80px;
            background:rgba(21,45,154,.55);
            border:2px solid var(--Principal_2);
            border-radius:20px;
            padding:40px 50px;
            backdrop-filter:blur(6px);
        }
        .form-wrapper h2{margin-bottom:25px;text-align:center;}
        .form-label{font-weight:600;margin-bottom:.35rem;}
        .form-control,
        .form-control:focus{
            background:transparent;
            border:none;
            border-bottom:2px solid var(--Principal_2);
            color:#fff;
            border-radius:0;
            box-shadow:none;
        }
        .form-control:focus{border-color:var(--Secundario_Blanco);}
        .btn-primary{
            width:100%;
            margin-top:30px;
            background:var(--Principal_2);
            border:3px solid var(--Principal_1);
            color:#fff;
            font-size:1.1rem;
            font-weight:bold;
            padding:10px;
            border-radius:50px;
            transition:.3s;
        }
        .btn-primary:hover{background:var(--Principal_1);}
        #msg{min-height:24px;margin-top:15px;text-align:center;font-weight:600;}
    </style>
</head>
<body>

<header class="main-header">
    <div class="container">
        <a href="/" class="logo">
            <img src="../img/logo_aitherTX.png" alt="Logo AITHER">
        </a>
        <nav class="main-nav">
            <ul>
                <li><a href="#">SABER MÁS</a></li>
                <li><a href="#">¿QUIÉNES SOMOS?</a></li>
                <li><a href="#">FAQ</a></li>
            </ul>
        </nav>
        <a href="login.html" class="btn-login">INICIAR SESIÓN</a>
    </div>
</header>

<main>
    <div class="form-wrapper">
        <h2>Formulario de incidencias</h2>
        <form id="incidenciaForm">
            <!-- Campo oculto: se rellena solo con el id del usuario logueado -->
            <input type="hidden" name="id_user" id="id_user">

            <div class="mb-3">
                <label class="form-label">Título *</label>
                <input type="text" name="titulo" class="form-control" maxlength="150" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Descripción *</label>
                <textarea name="descripcion" class="form-control" rows="4" required></textarea>
            </div>

            <!-- Botón para elegir imagen (por ahora solo selecciona) -->
            <div class="mb-3">
                <label class="form-label">Imagen (opcional)</label>
                <input type="file" name="imagen" class="form-control" accept="image/*">
            </div>

            <button type="submit" class="btn btn-primary">Enviar incidencia</button>
            <div id="msg"></div>
        </form>
    </div>
</main>

<script>
/* 1. Rellenar id_user desde localStorage */
const user = JSON.parse(localStorage.getItem("user"));
if (!user || !user.id) {
    alert("No se ha encontrado sesión. Redirigiendo al login.");
    location.href = "login.html";
} else {
    document.getElementById("id_user").value = user.id;
}

/* 2. Enviar formulario (por ahora solo recoge datos) */
document.getElementById("incidenciaForm").addEventListener("submit", async e => {
    e.preventDefault();
    const form = e.target;
    const data = Object.fromEntries(new FormData(form)); // id_user, titulo, descripcion, imagen (File o vacío)

    const res = await fetch('api/index.php?action=crearIncidencia', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(data)
    }).then(r => r.json());

    const box = document.getElementById('msg');
    box.className = res.status==='ok' ? 'text-success' : 'text-danger';
    box.textContent = res.message || res.status;
    if(res.status==='ok') form.reset();
});
</script>
</body>
</html>
